# NATS Server Configuration
# JetStream enabled with authentication

port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_mem_store: 256MB
  max_file_store: 1GB
}

authorization {
  users = [
    { user: $NATS_USER, password: $NATS_PASSWORD }
  ]
}

max_payload: 1MB

# Logging
debug: false
trace: false
logtime: true
